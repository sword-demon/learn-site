<style>
/* ============================================================
   拾阶学社 · 新中式纸墨编辑风 视觉系统
   纸 paper / 墨 ink / 朱砂 seal / 黛青 indigo / 苔绿 moss
   ============================================================ */
:root {
  --paper: #f6f1e7;
  --paper-2: #efe8da;
  --card: #fffdf8;
  --card-2: #faf6ec;
  --ink: #2b2620;
  --ink-2: #6b6355;
  --ink-3: #998f7d;
  --line: #e3d9c6;
  --line-2: #d2c5a9;
  --seal: #b5402c;
  --seal-soft: #f3ded7;
  --seal-deep: #8f3121;
  --indigo: #33566b;
  --indigo-soft: #e2ebee;
  --moss: #2f7d57;
  --moss-soft: #e0ede4;
  --gold: #a8842c;
  --gold-soft: #f1e8d2;
  --shadow: 0 6px 24px rgba(43, 38, 32, .07);
  --shadow-lg: 0 18px 48px rgba(43, 38, 32, .14);
  --r: 4px;
  --serif: "Noto Serif SC", "Songti SC", serif;
  --sans: "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "JetBrains Mono", "PingFang SC", monospace;
}
html[data-theme="night"] {
  --paper: #23201b;
  --paper-2: #1c1a15;
  --card: #2b2721;
  --card-2: #322d26;
  --ink: #e9e2d2;
  --ink-2: #b0a691;
  --ink-3: #7d7462;
  --line: #3d382f;
  --line-2: #4c453a;
  --seal: #d05a43;
  --seal-soft: #40261f;
  --seal-deep: #e0785f;
  --indigo: #8fb4c9;
  --indigo-soft: #26333b;
  --moss: #6cb38c;
  --moss-soft: #263629;
  --gold: #c9a45a;
  --gold-soft: #3a3122;
  --shadow: 0 6px 24px rgba(0, 0, 0, .3);
  --shadow-lg: 0 18px 48px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.75;
  font-size: 15px;
}
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(43, 38, 32, .05) 1px, transparent 1px);
  background-size: 22px 22px;
  opacity: .5;
}
html[data-theme="night"] body::before { opacity: .25; }
#page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
a { color: var(--indigo); text-decoration: none; }
a:hover { color: var(--seal); }
button { font-family: inherit; }
::selection { background: var(--seal-soft); }

/* ---------- 报头 masthead ---------- */
.masthead { border-bottom: 1px solid var(--line-2); background: var(--card); }
.masthead-inner {
  max-width: 1180px; margin: 0 auto; padding: 14px 24px 0;
  display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.seal-mark {
  width: 52px; height: 52px; background: var(--seal); color: #f9f3e8;
  font-family: var(--serif); font-weight: 900; font-size: 17px; line-height: 1.15;
  display: grid; grid-template-columns: 1fr 1fr; place-items: center;
  border-radius: 6px; transform: rotate(-3deg);
  box-shadow: inset 0 0 0 2px rgba(249, 243, 232, .55), inset 0 0 0 4px var(--seal), 0 4px 10px rgba(143, 49, 33, .3);
  padding: 4px;
}
.seal-mark span { display: block; }
.brand-txt h1 { font-family: var(--serif); font-size: 22px; margin: 0; font-weight: 900; letter-spacing: .12em; }
.brand-txt p { margin: 0; font-size: 12px; color: var(--ink-2); letter-spacing: .18em; }
.mainnav { display: flex; gap: 4px; flex: 1; min-height: 56px; align-items: stretch; }
.mainnav a {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 16px;
  color: var(--ink-2); font-size: 15px; border-bottom: 3px solid transparent;
  position: relative; cursor: pointer;
}
.mainnav a:hover { color: var(--ink); }
.mainnav a.on { color: var(--seal); font-weight: 700; border-bottom-color: var(--seal); }
.nav-badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--seal); color: #fff; font-size: 11px; line-height: 18px;
  text-align: center; font-family: var(--mono);
}
.masthead-tools { display: flex; align-items: center; gap: 10px; }
.chip-user {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2);
  background: var(--card-2); border-radius: 999px; padding: 5px 14px 5px 6px;
  font-size: 13px; cursor: pointer; color: var(--ink);
}
.chip-user .avatar {
  width: 26px; height: 26px; border-radius: 50%; background: var(--indigo);
  color: #fff; display: grid; place-items: center; font-size: 12px; font-family: var(--serif);
}
.btn-night {
  border: 1px solid var(--line-2); background: var(--card-2); color: var(--ink-2);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 15px;
}
.btn-night:hover { color: var(--seal); border-color: var(--seal); }

/* ---------- 通用 ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; width: 100%; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; cursor: pointer; border-radius: var(--r);
  font-size: 15px; padding: 10px 22px; font-weight: 500;
  transition: transform .06s ease, box-shadow .15s ease;
  text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--seal); color: #f9f3e8; box-shadow: 0 4px 14px rgba(181, 64, 44, .28); }
.btn-primary:hover { background: var(--seal-deep); color: #fff; }
.btn-primary[disabled] { background: var(--ink-3); box-shadow: none; cursor: not-allowed; }
.btn-ghost { background: var(--card); border-color: var(--line-2); color: var(--ink); box-shadow: var(--shadow); }
.btn-ghost:hover { border-color: var(--seal); color: var(--seal); }
.btn-sm { padding: 5px 14px; font-size: 13px; }
.btn-link { border: 0; background: none; color: var(--indigo); cursor: pointer; padding: 0; font-size: 13px; }
.btn-link:hover { color: var(--seal); }
.tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  padding: 1px 9px; border-radius: 3px; border: 1px solid var(--line-2);
  color: var(--ink-2); background: var(--card); font-family: var(--mono); white-space: nowrap;
}
.tag-free { color: var(--moss); border-color: var(--moss); background: var(--moss-soft); }
.tag-sale { color: var(--seal); border-color: var(--seal); background: var(--seal-soft); }
.tag-trial { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.tag-lock { color: var(--ink-3); }
.tag-on { color: var(--indigo); border-color: var(--indigo); background: var(--indigo-soft); }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.stars .off { color: var(--line-2); }
.price-now { font-family: var(--serif); font-weight: 900; }
.price-std { text-decoration: line-through; color: var(--ink-3); font-size: 13px; }
.crumbs { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumbs .sep { color: var(--line-2); }
.hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.empty {
  text-align: center; color: var(--ink-3); padding: 64px 20px; font-size: 14px;
  border: 1px dashed var(--line-2); border-radius: var(--r); background: var(--card-2);
}
.empty .serif { font-size: 17px; display: block; margin-bottom: 6px; color: var(--ink-2); }

/* ---------- 封面 ---------- */
.cover {
  position: relative; overflow: hidden; border-radius: 3px; display: grid;
  place-items: center; background: var(--hue, #34566b);
  border: 1px solid var(--line-2);
}
.cover::before {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(-45deg, rgba(255, 253, 248, .06) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, rgba(255, 253, 248, .14), transparent 55%);
}
.cover::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
  background: rgba(20, 16, 12, .22);
  border-top: 1px solid rgba(255, 253, 248, .25);
}
.cover b {
  font-family: var(--serif); font-weight: 900; color: rgba(255, 253, 248, .92);
  position: relative; z-index: 1; text-shadow: 0 2px 6px rgba(0, 0, 0, .25);
}
.cover .cover-meta {
  position: absolute; z-index: 2; left: 10px; bottom: 6px; color: rgba(255, 253, 248, .95);
  font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
}

/* ---------- 首页：分类树 + 书目列表 ---------- */
.home-grid { display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start; }
@media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }
.tree-panel { position: sticky; top: 20px; }
.tree-panel h3 {
  font-family: var(--serif); font-size: 15px; margin: 0 0 10px; letter-spacing: .2em;
  color: var(--ink-2); border-bottom: 2px solid var(--ink); padding-bottom: 8px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.tree { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.tree .tree-row {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 3px;
  cursor: pointer; color: var(--ink-2); position: relative;
}
.tree .tree-row:hover { background: var(--card-2); color: var(--ink); }
.tree .tree-row.on { background: var(--seal-soft); color: var(--seal); font-weight: 700; }
.tree .tree-row.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; background: var(--seal); }
.tree .tree-branch { list-style: none; margin: 0; padding-left: 20px; border-left: 1px solid var(--line-2); margin-left: 10px; }
.tree .caret { font-size: 10px; color: var(--ink-3); width: 12px; transition: transform .15s; }
.tree .closed > .tree-branch { display: none; }
.tree .closed > .tree-row .caret { transform: rotate(-90deg); }
.tree .cnt { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.list-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; flex-wrap: wrap; }
.list-head h2 { font-family: var(--serif); font-size: 24px; margin: 0; font-weight: 900; letter-spacing: .04em; }
.list-head .cnt { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

.entry-list { display: flex; flex-direction: column; }
.entry {
  display: grid; grid-template-columns: 148px 1fr auto; gap: 20px;
  padding: 22px 6px; border-bottom: 1px solid var(--line); align-items: center;
  cursor: pointer; position: relative; border-radius: 3px;
}
.entry:hover { background: var(--card-2); }
.entry .cover { height: 96px; }
.entry h3 { font-family: var(--serif); font-size: 18px; margin: 2px 0 6px; font-weight: 700; }
.entry:hover h3 { color: var(--seal); }
.entry .digest { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry .meta { display: flex; gap: 12px; align-items: center; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.entry .meta b { color: var(--ink-2); font-weight: 500; }
.entry-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 120px; }
.entry-side .price-line { display: flex; align-items: baseline; gap: 8px; }
.favbtn {
  border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 17px;
  padding: 4px; line-height: 1;
}
.favbtn.on { color: var(--seal); }
.mini-progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; width: 100%; }
.mini-progress i { display: block; height: 100%; background: var(--moss); }
@media (max-width: 720px) { .entry { grid-template-columns: 1fr; } .entry-side { flex-direction: row; align-items: center; } }

/* ---------- 课程详情 ---------- */
.course-head { display: grid; grid-template-columns: 300px 1fr; gap: 32px; margin-top: 18px; }
@media (max-width: 860px) { .course-head { grid-template-columns: 1fr; } }
.course-head .cover { height: 188px; }
.course-head h2 { font-family: var(--serif); font-size: 28px; font-weight: 900; margin: 4px 0 10px; letter-spacing: .02em; }
.course-stats { display: flex; gap: 18px; color: var(--ink-2); font-size: 13.5px; flex-wrap: wrap; margin: 12px 0; }
.course-stats b { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.buy-panel { position: sticky; top: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.buy-panel .big-price { display: flex; align-items: baseline; gap: 10px; }
.buy-panel .big-price .price-now { font-size: 34px; color: var(--seal); }
.buy-panel .hint { font-size: 12px; color: var(--ink-3); }
.buy-panel .row { display: flex; gap: 10px; }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line-2); margin: 34px 0 26px; }
.tabs button {
  border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--ink-2);
  padding: 10px 20px; position: relative; font-family: var(--serif); letter-spacing: .1em;
}
.tabs button.on { color: var(--seal); font-weight: 700; }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: var(--seal); }

/* 富文本简介 */
.rich { max-width: 720px; }
.rich h3 { font-family: var(--serif); font-size: 19px; margin: 28px 0 10px; padding-left: 12px; border-left: 4px solid var(--seal); }
.rich p { margin: 10px 0; }
.rich blockquote {
  margin: 18px 0; padding: 14px 20px; background: var(--card-2);
  border-left: 4px solid var(--gold); color: var(--ink-2); font-family: var(--serif);
}
.rich ul { padding-left: 22px; }
.rich li { margin: 6px 0; }
.fig {
  margin: 20px 0; border: 1px solid var(--line-2); background: var(--card-2);
  border-radius: 3px; padding: 18px 20px; font-family: var(--mono); font-size: 12.5px;
  color: var(--ink-2); line-height: 2;
}
.fig .fig-cap { font-family: var(--sans); color: var(--ink-3); font-size: 12px; margin-top: 8px; border-top: 1px dashed var(--line-2); padding-top: 8px; }

/* 目录 */
.chapter { margin-bottom: 26px; }
.chapter > h4 {
  font-family: var(--serif); font-size: 16px; margin: 0 0 4px; display: flex;
  align-items: baseline; gap: 12px;
}
.chapter > h4 .no { color: var(--seal); font-family: var(--mono); font-size: 13px; }
.chapter > .cdesc { font-size: 13px; color: var(--ink-3); margin: 0 0 10px; }
.lesson-row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 10px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 3px;
}
.lesson-row:hover { background: var(--card-2); }
.lesson-row.cur { background: var(--seal-soft); }
.lesson-row.cur .l-title { color: var(--seal); font-weight: 700; }
.l-title { font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.l-meta { font-size: 12px; color: var(--ink-3); font-family: var(--mono); margin-top: 2px; }
.typechip {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 2px;
  border: 1px solid var(--line-2); color: var(--ink-2); letter-spacing: .05em; white-space: nowrap;
}
.typechip.t-md { color: var(--indigo); border-color: var(--indigo); }
.typechip.t-pdf { color: var(--gold); border-color: var(--gold); }
.typechip.t-video { color: var(--seal); border-color: var(--seal); }
.l-done { color: var(--moss); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
.l-lock { color: var(--ink-3); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }

/* ---------- 评价 ---------- */
.rate-summary { display: flex; gap: 28px; align-items: center; padding: 18px 20px; margin-bottom: 24px; }
.rate-summary .score { font-family: var(--serif); font-size: 44px; font-weight: 900; color: var(--gold); line-height: 1; }
.review { padding: 20px 4px; border-bottom: 1px solid var(--line); }
.review-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.review-head .who { font-weight: 700; font-size: 14px; }
.review-head .when { color: var(--ink-3); font-size: 12px; font-family: var(--mono); }
.review-body { margin: 8px 0 6px; }
.reply { border-left: 2px solid var(--line-2); padding: 10px 0 2px 18px; margin-top: 10px; }
.reply .review-head .who { font-size: 13px; }
.reply .review-body { font-size: 13.5px; color: var(--ink-2); margin: 4px 0; }
.reply-toggle { margin-top: 8px; }
.thread { margin-top: 4px; }
.rv-form { padding: 18px 20px; margin-bottom: 26px; display: flex; flex-direction: column; gap: 12px; }
.star-input { display: flex; gap: 6px; font-size: 26px; color: var(--line-2); cursor: pointer; }
.star-input span.on { color: var(--gold); }
textarea, input[type="text"], input[type="password"], input[type="tel"] {
  font-family: inherit; font-size: 14px; border: 1px solid var(--line-2); border-radius: 3px;
  background: var(--card); color: var(--ink); padding: 9px 12px; width: 100%;
}
textarea { min-height: 88px; resize: vertical; line-height: 1.7; }
textarea:focus, input:focus { outline: 2px solid rgba(181, 64, 44, .25); border-color: var(--seal); }
.form-note { font-size: 12.5px; color: var(--ink-3); }

/* ---------- 学习页 ---------- */
.learn-top {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 14px 0; border-bottom: 2px solid var(--ink); margin-bottom: 26px;
}
.learn-top h2 { font-family: var(--serif); font-size: 20px; margin: 0; font-weight: 900; }
.learn-top .pbar { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.learn-grid { display: grid; grid-template-columns: 1fr 300px; gap: 32px; align-items: start; }
@media (max-width: 980px) { .learn-grid { grid-template-columns: 1fr; } }
.stage { padding: 28px 32px; min-height: 340px; }
.stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.stage-head h3 { font-family: var(--serif); font-size: 20px; margin: 0; font-weight: 900; }
.stage-sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 18px; font-family: var(--mono); }
.article { font-size: 15.5px; max-width: 680px; }
.article h4 { font-family: var(--serif); font-size: 17px; margin: 26px 0 8px; }
.article code { font-family: var(--mono); background: var(--card-2); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; font-size: 13px; }
.article pre {
  font-family: var(--mono); font-size: 13px; background: var(--card-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 14px 16px; overflow-x: auto; line-height: 1.8; color: var(--ink-2);
}
.stage-foot { display: flex; align-items: center; gap: 14px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.stage-foot .spacer { flex: 1; }

/* PDF 模拟 */
.pdf-frame {
  background: var(--card-2); border: 1px solid var(--line-2); border-radius: 3px;
  aspect-ratio: 1 / 1.28; max-width: 620px; padding: 40px 46px; position: relative;
  box-shadow: var(--shadow-lg); overflow: auto;
}
.pdf-frame h4 { font-family: var(--serif); font-size: 18px; margin: 0 0 4px; }
.pdf-frame .pdfno { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .2em; }
.pdf-frame p { font-size: 14px; }
.pdf-frame ul { padding-left: 20px; font-size: 14px; }
.pdf-pager { display: flex; align-items: center; gap: 14px; margin-top: 14px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }

/* 视频模拟 */

function catName(id) {
  for (const a of CATS) {
    if (a.id === id) return a.name;
    for (const b of a.children || []) {
      if (b.id === id) return b.name;
      for (const c of b.children || []) if (c.id === id) return c.name;
    }
  }

}

function findLesson(course, lessonId) {
  for (let ci = 0; ci < course.chapters.length; ci++) {
    const ch = course.chapters[ci];
    const li = ch.lessons.findIndex(l => l.id === lessonId);
    if (li >= 0) return { chapter: ch, lesson: ch.lessons[li], ci, li };
  }
  return null;
}
function catPathName(course) { return course.catPath.map(catName).join(" / "); }

}

function hasAccess(courseId) { return !!(S.user && S.access[courseId]); }
function isTrial(courseId, lessonId) {
  const c = courseById(courseId);
  const f = c && findLesson(c, lessonId);
  return !!(f && f.lesson.trial);
}
function canViewLesson(courseId, lessonId) { return hasAccess(courseId) || isTrial(courseId, lessonId); }
function progressOf(courseId) {
  const course = courseById(courseId);
  const total = lessonsOf(course).length;
  const rec = S.progress[courseId];
  const done = rec ? lessonsOf(course).filter(l => rec.lessons[l.id] && rec.lessons[l.id].done).length : 0;
  return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
}
function isCourseCompleted(courseId) { const p = progressOf(courseId); return p.total > 0 && p.done === p.total; }
function ratingOf(courseId) {
  const rs = S.reviews.filter(r => r.courseId === courseId);
  if (!rs.length) return null;
  const avg = rs.reduce((s, r) => s + r.stars, 0) / rs.length;
  return { avg: Math.round(avg * 10) / 10, count: rs.length };
}
function starsHTML(n, count) {
  let h = '<span class="stars">';
  for (let i = 1; i <= 5; i++) h += '<span class="' + (i <= Math.round(n) ? "" : "off") + '">★</span>';
  h += "</span>";

}

function drawCaptcha() {
  const cv = $("#lg-canvas");
  if (!cv) return;
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  CAP_CODE = "";
  for (let i = 0; i < 4; i++) CAP_CODE += chars[Math.floor(Math.random() * chars.length)];
  const ctx2d = cv.getContext("2d");
  ctx2d.clearRect(0, 0, 92, 40);
  ctx2d.fillStyle = "#efe8da"; ctx2d.fillRect(0, 0, 92, 40);
  ctx2d.strokeStyle = "rgba(107,99,85,.4)";
  for (let i = 0; i < 4; i++) {
    ctx2d.beginPath(); ctx2d.moveTo(Math.random() * 92, Math.random() * 40);
    ctx2d.lineTo(Math.random() * 92, Math.random() * 40); ctx2d.stroke();
  }
  for (let i = 0; i < 4; i++) {
    ctx2d.save();
    ctx2d.translate(14 + i * 21, 22 + (Math.random() * 8 - 4));
    ctx2d.rotate((Math.random() - 0.5) * 0.6);
    ctx2d.font = "700 20px 'JetBrains Mono', monospace";
    ctx2d.fillStyle = ["#b5402c", "#33566b", "#4c7a5a", "#a8842c"][i % 4];

    ctx2d.fillText(CAP_CODE[i], 0, 0);
    ctx2d.restore();
  }
}

function countUnder(catId) {
  if (!catId) return COURSES.length;
  return COURSES.filter(c => c.catPath.slice(0, c.catPath.indexOf(catId) + 1).includes(catId)).length;
}
function treeHTML(nodes, level, sel) {
  let h = "";
  for (const n of nodes) {
    const kids = n.children || [];
    const on = sel === n.id ? " on" : "";
    h += '<li class="' + (kids.length && treeClosed[n.id] ? "closed" : "") + '">';
    h += '<div class="tree-row' + on + '" data-act="cat" data-cat="' + n.id + '">';
    h += kids.length ? '<span class="caret">▼</span>' : '<span class="caret" style="visibility:hidden">·</span>';
    h += esc(n.name) + '<span class="cnt">' + countUnder(n.id) + "</span></div>";
    if (kids.length) h += '<ul class="tree-branch">' + treeHTML(kids, level + 1, sel) + "</ul>";
    h += "</li>";
  }
  return h;
}
let treeClosed = {};
function vHome() {
  const sel = S.route.cat;

  const path = [];

    for (const n of nodes) {
      if (n.id === sel) { path.push.apply(path, trail.concat(n.name)); return true; }

function findReviewNode(rootId) {
  function walk(nodes) {
    for (const n of nodes) {
      if (n.id === rootId) return n;
      const f = n.replies && walk(n.replies);
      if (f) return f;
    }
    return null;
  }
  return walk(S.reviews);
}

function fmtSec(s) { const m = Math.floor(s / 60), ss = Math.floor(s % 60); return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0"); }

/* 视频模拟 */
function bindVideo() {
  const playBtn = $("#v-play"), toggle = $("#v-toggle");
  if (!playBtn) return;
  const courseId = S.route.courseId, lessonId = S.route.lessonId;
  const course = courseById(courseId);
  const lesson = findLesson(course, lessonId).lesson;
  const dur = lesson.meta === "12:00" ? 720 : lesson.meta === "15:00" ? 900 : lesson.meta === "18:00" ? 1080 : lesson.meta === "16:00" ? 960 : lesson.meta === "22:00" ? 1320 : 600;
  const rec = ensureProgress(courseId);
  if (!rec.lessons[lessonId]) rec.lessons[lessonId] = {};
  let t = rec.lessons[lessonId].pos || 0;
  let playing = false;
  const fill = $("#v-fill"), time = $("#v-time");
  const paint = () => {
    fill.style.width = (Math.min(1, t / dur) * 100).toFixed(1) + "%";
    time.textContent = fmtSec(t) + " / " + lesson.meta;
  };
  paint();
  const setPlay = on => {
    playing = on;
    playBtn.style.display = on ? "none" : "grid";
    toggle.textContent = on ? "⏸" : "▶";
  };
  const complete = () => {
    if (VT) { clearInterval(VT); VT = null; }
    setPlay(false);
    savePos(courseId, lessonId, dur);
    if (!rec.lessons[lessonId].done) markLessonDone(courseId, lessonId, false);
  };
  playBtn.addEventListener("click", () => setPlay(true));
  toggle.addEventListener("click", () => {
    if (!playing && t >= dur) t = 0;
    setPlay(!playing);
  });
  $("#v-track").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    t = Math.round((e.clientX - r.left) / r.width * dur);
    savePos(courseId, lessonId, t);
    paint();
  });
  if (VT) { clearInterval(VT); VT = null; }
  VT = setInterval(() => {
    if (!playing) return;
    t = Math.min(dur, t + 12); // 200ms 一跳，60 倍速
    savePos(courseId, lessonId, t);
    paint();
    if (t / dur >= 0.9 && !rec.lessons[lessonId].done) { toast("观看已达 90%，本节自动完成"); }
    if (t >= dur) complete();
  }, 200);
}

    '<button type="button" class="btn btn-ghost btn-sm" data-act="run-cleanup">运行清理任务</button></div>' +
    '<p class="muted small" style="margin:0 0 14px">公告与站内信来自站长发送，问答 / 进度 / 授权为系统自动通知；清理任务会删除创建超过 2 个月（60 天）的收件箱消息。</p>' +
    '<div class="panel" style="flex-direction:row;display:flex;gap:12px;align-items:center;margin-bottom:14px;padding:12px 18px;background:var(--seal-soft);border-color:var(--seal)">' +
      '<span class="serif" style="font-weight:900;font-size:14px">演示 · 模拟站长发送</span>' +
      '<span class="small muted" style="flex:1">点击后约 3 秒内消息会实时推送到达（可先切到其他页面，观察导航角标变化）。</span>' +
      '<button type="button" class="btn btn-primary btn-sm" data-act="demo-send" data-kind="notice">发公告（全体）</button>' +
      '<button type="button" class="btn btn-primary btn-sm" data-act="demo-send" data-kind="dm">发站内信（仅我）</button>' +
    "</div>";
  if (!S.messages.length) return bar + '<div class="empty"><span class="serif">没有消息</span>公告、站内信与问答、进度、授权等系统通知会出现在这里</div>';
  return bar + '<div class="panel">' + S.messages.map(m => {
    const t = MSG_TYPES[m.type] || { label: "通知", cls: "tag-lock" };
    return `<div class="msg-row" data-act="read-msg" data-mid="${m.id}" data-course="${m.courseId}" data-lesson="${m.lessonId || ""}">
      <div class="msg-dot ${m.read ? "read" : ""}"></div>
      <div><div class="mtitle">${m.read ? "" : '<span class="tag tag-sale" style="font-size:10px;margin-right:6px">未读</span>'}<span class="tag ${t.cls}" style="font-size:10px;margin-right:6px">${t.label}</span>${esc(m.title)}</div><div class="mbody">${esc(m.body)}</div></div>
      <span class="when small muted">${esc(m.time)}</span>
    </div>`;
  }).join("") + "</div>";
}

/* ============================================================
   路由与渲染
   ============================================================ */
function parseHash() {
  const h = (location.hash || "#/home").replace(/^#\//, "").split("/").filter(Boolean);
  const r = { name: "home", cat: null, courseId: null, lessonId: null, mapId: null, tab: "intro" };
  if (!h.length) return r;
  if (h[0] === "home") { r.name = "home"; r.cat = h[1] || null; }
  else if (h[0] === "course") { r.name = "course"; r.courseId = h[1] || null; r.tab = h[2] || "intro"; }
  else if (h[0] === "learn") { r.name = "learn"; r.courseId = h[1] || null; r.lessonId = h[2] || null; }
  else if (h[0] === "maps") r.name = "maps";
  else if (h[0] === "map") { r.name = "map"; r.mapId = h[1] || null; }
  else if (h[0] === "my") r.name = "my";
  else if (h[0] === "fav") r.name = "fav";
  else if (h[0] === "orders") r.name = "orders";
  else if (h[0] === "msgs") r.name = "msgs";
  return r;
}
function render() {
  if (VT) { clearInterval(VT); VT = null; }
  S.route = parseHash();
  const authViews = { my: "我的学习", fav: "收藏", orders: "我的订单", msgs: "消息" };
  if (authViews[S.route.name] && !S.user) openLogin("「" + authViews[S.route.name] + "」需要学员登录后使用");
  renderNav();
  const app = $("#app");
  const v = { home: vHome, course: vCourse, learn: vLearn, maps: vMaps, map: vMap, my: vMy, fav: vFav, orders: vOrders, msgs: vMsgs }[S.route.name] || vHome;
  app.innerHTML = '<div class="fade">' + v() + "</div>";
  if (S.route.name === "learn") bindVideo();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { closeModal(); render(); });

/* ============================================================
   事件委托
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  switch (act) {
    case "nav": stop(); location.hash = el.dataset.route; break;
    case "login": stop(); openLogin(); break;
    case "close": stop(); closeModal(); break;
    case "overlay": if (e.target === el) closeModal(); break;
    case "refresh-cap": stop(); drawCaptcha(); break;
    case "do-login": stop(); tryLogin(); break;
    case "user-menu": stop(); toast("演示账号：" + S.user.nick + " · 退出请刷新页面（原型简化）"); break;
    case "cat": stop(); {
      const cat = el.dataset.cat;
      location.hash = cat ? "#/home/" + cat : "#/home";
      break;
    }
    case "go-course": stop(); location.hash = "#/course/" + el.dataset.course; break;
    case "course-tab": stop(); location.hash = "#/course/" + S.route.courseId + "/" + el.dataset.tab; break;
    case "open-lesson": stop(); {
      const cid = el.dataset.course, lid = el.dataset.lesson;
      location.hash = "#/learn/" + cid + "/" + lid;
      break;
    }
    case "start-free": stop(); startFree(el.dataset.course); break;
    case "buy": stop(); openBuy(el.dataset.course); break;
    case "confirm-buy": stop(); buyCourse(el.dataset.course); break;
    case "poster": stop(); openPoster(el.dataset.course); break;
    case "copy-link": stop(); copyLink(el.dataset.url); break;
    case "dl-poster": stop(); toast("海报已生成（演示）：请在本地右键保存弹层中的海报图"); break;
    case "fav": stop(); toggleFav(el.dataset.course); break;
    case "mark-done": stop(); markLessonDone(el.dataset.course, el.dataset.lesson, false); break;
    case "pdf-prev": stop(); {
      const cid = el.dataset.course, lid = el.dataset.lesson;
      const rec = ensureProgress(cid);
      const cur = (rec.lessons[lid] && rec.lessons[lid].pos) || 0;
      savePos(cid, lid, Math.max(0, cur - 1));
      render();
      break;
    }
    case "pdf-next": stop(); {
      const cid = el.dataset.course, lid = el.dataset.lesson;
      const rec = ensureProgress(cid);
      const cur = (rec.lessons[lid] && rec.lessons[lid].pos) || 0;
      savePos(cid, lid, Math.min(parseInt(el.dataset.max, 10) - 1, cur + 1));
      render();
      break;
    }
    case "go-map": stop(); location.hash = "#/map/" + el.dataset.map; break;
    case "join-map": stop(); {
      if (!S.user) { openLogin("登录后即可加入学习地图"); break; }
      S.joinedMaps.push(el.dataset.map);
      toast("已加入路径，从建议的下一步开始吧");
      render();
      break;
    }
    case "reply-form": stop(); {
      const rid = el.dataset.rid;
      const box = el.parentElement;
      if ($("#reply-box")) { $("#reply-box").remove(); break; }
      const div = document.createElement("div");
      div.id = "reply-box";
      div.style.marginTop = "8px";
      div.innerHTML = '<textarea id="reply-body" placeholder="回复 ' + esc((findReviewNode(rid) || {}).who || "") + '…" style="min-height:56px"></textarea>' +
        '<div style="margin-top:6px"><button type="button" class="btn btn-primary btn-sm" data-act="submit-reply" data-rid="' + rid + '">回复</button></div>';
      box.insertBefore(div, el.nextSibling);
      $("#reply-body").focus();
      break;
    }
    case "submit-reply": stop(); {
      const rid = el.dataset.rid;
      const body = $("#reply-body").value.trim();
      if (!body) { toast("回复内容不能为空"); break; }
      const node = findReviewNode(rid);
      if (!node) break;
      node.replies = node.replies || [];
      node.replies.push({ id: "rp" + Date.now(), who: S.user.nick, body: body, time: "刚刚", replies: [] });
      toast("回复成功");
      render();
      break;
    }
    case "toggle-node": stop(); {
      const node = findReviewNode(el.dataset.rid);
      if (node) { node.closed = !node.closed; render(); }
      break;
    }
    case "ask": stop(); {
      const cid = el.dataset.course, lid = el.dataset.lesson;
      const title = $("#qa-title").value.trim();
      const body = $("#qa-body").value.trim();
      if (!title || !body) { toast("请填写问题标题和内容"); break; }
      const q = { id: "q" + Date.now(), courseId: cid, lessonId: lid, title: title, status: "pending", who: S.user.nick, time: "刚刚", body: body, thread: [] };
      S.questions.push(q);
      toast("问题已提交 · 待回答（教师回答后将通知你）");
      render();
      /* 演示：模拟教师在 6 秒后回答并生成站内消息（用户故事 4 / 19） */
      setTimeout(() => {
        q.status = "answered";
        q.thread.push({ who: courseById(cid).teacher, isTeacher: true, time: "刚刚", body: "好问题。这一处演示环境里简化了实现细节，核心思路是：先确认你复现了问题，再对照讲义第 2 页第 3 条检查清单逐项排查，通常卡点在清理时机那一环。有进展欢迎继续追问。" });
        S.messages.unshift({ id: "m" + Date.now(), type: "qa", title: "你的问题有了新回答", body: "「" + title + "」已由 " + courseById(cid).teacher + " 回答。", courseId: cid, lessonId: lid, read: false, time: "刚刚", createdAt: Date.now() });
        renderNav();
        toast("教师已回答你的问题，可在「消息」中查看");
        if (parseHash().name === "learn" && parseHash().courseId === cid && parseHash().lessonId === lid) render();
      }, 6000);
      break;
    }
    case "read-msg": stop(); {
      const m = S.messages.find(x => x.id === el.dataset.mid);
      if (m) m.read = true;
      if (el.dataset.lesson) location.hash = "#/learn/" + el.dataset.course + "/" + el.dataset.lesson;
      render();
      break;
    }
    case "mark-all-read": stop(); {
      const n = unreadCount();
      S.messages.forEach(m => { m.read = true; });
      render();
      toast(n ? "已全部标记为已读（" + n + " 条）" : "当前没有未读消息");
      break;
    }
    case "run-cleanup": stop(); {
      const cutoff = Date.now() - 60 * 864e5;
      const before = S.messages.length;
      S.messages = S.messages.filter(m => (m.createdAt || 0) >= cutoff);
      const removed = before - S.messages.length;
      render();
      toast(removed ? "清理任务完成 · 删除 " + removed + " 条超过 2 个月的消息，其余保留" : "清理任务完成 · 暂无超过 2 个月的消息");
      break;
    }
    case "demo-send": stop(); {
      const kind = el.dataset.kind;
      toast(kind === "notice" ? "公告已提交，正在向全体在册学员投递…" : "站内信已提交，正在投递给你…");
      const now = Date.now();
      setTimeout(() => {
        if (!S.user) return;
        if (kind === "notice") {
          S.messages.unshift({ id: "m-n" + now, type: "notice", title: "新公告：学习地图「前端筑基」已更新", body: "「前端筑基」地图新增两门课程与配套练习，已加入地图的学员会自动获得新课学习权限。", read: false, time: "刚刚", createdAt: now });
        } else {
          S.messages.unshift({ id: "m-d" + now, type: "dm", title: "站内信：感谢你的持续学习", body: "你近两周完成了多节课节，继续保持！如需课程建议，欢迎在课节问答中留言。", read: false, time: "刚刚", createdAt: now });
        }
        toast("新消息已通过实时推送到达（未读角标已更新）");
        if (parseHash().name === "msgs") render(); else renderNav();
      }, 3000);
      break;
    }
    case "reset": stop(); {
      S = freshState();
      treeClosed = {};
      location.hash = "#/home";
      render();
      toast("演示数据已重置");
      break;
    }
  }
});

/* 星级输入（事件委托 mouseover 简化为点击） */
document.addEventListener("click", e => {
  const star = e.target.closest("#star-input span");
  if (!star) return;
  const box = $("#star-input");
  const n = parseInt(star.dataset.star, 10);
  $$("#star-input span").forEach(s => { s.classList.toggle("on", parseInt(s.dataset.star, 10) <= n); });
  box.dataset.value = n;
});
document.addEventListener("click", e => {
  const btn = e.target.closest('[data-act="save-review"]');
  if (!btn) return;
  e.preventDefault();
  const courseId = btn.dataset.course;
  const isEdit = btn.dataset.edit === "1";
  const body = $("#rv-body").value.trim();
  const stars = parseInt($("#star-input").dataset.value || "0", 10) || $$("#star-input span.on").length;
  if (!stars || !body) { toast("请先选择星级并填写评价内容"); return; }
  if (isEdit) {
    const mine = S.reviews.find(r => r.courseId === courseId && r.who === S.user.nick);
    mine.stars = stars; mine.body = body; mine.edited = true;
    toast("评价已更新");
  } else {
    S.reviews.unshift({ id: "r" + Date.now(), courseId: courseId, who: S.user.nick, stars: stars, body: body, time: "刚刚", replies: [] });
    toast("评价已发布 · 评分已重新计算");
  }
  render();
});

/* 夜读模式 */
$("#btn-night").addEventListener("click", () => {
  const html = document.documentElement;
  const night = html.dataset.theme === "night";
  if (night) { html.removeAttribute("data-theme"); $("#btn-night").textContent = "☾"; }
  else { html.dataset.theme = "night"; $("#btn-night").textContent = "☀"; }
});

/* 启动 */
if (!location.hash) location.hash = "#/home";
render();
</script>
