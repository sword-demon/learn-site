server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /healthz is served from a static file so the container healthcheck
    # doesn't depend on the SPA bundle.
    location = /healthz {
        alias /etc/nginx/healthz.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Proxy /api/* to the API container. Tokens are Bearer headers (Axios),
    # never Session cookies.
    location /api/ {
        # nginx defaults to 1m, which 413s cover uploads >1MB before they
        # reach the API (covers allow 5 MiB; workerman caps at 10 MiB).
        client_max_body_size 10m;
        proxy_pass http://api:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA fallback: history-mode routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed bundles are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}